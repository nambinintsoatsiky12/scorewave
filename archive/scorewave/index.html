<style>
:root{--bg:#0a0d12;--panel:#11161d;--panel2:#171e27;--line:#202835;--text:#f5f7fa;--muted:#8a93a3;--accent:#c9f24e;--live:#ff4d4d;--gold:#ffc94d;--radius:12px}
body.light{--bg:#f4f6f8;--panel:#ffffff;--panel2:#eef1f4;--line:#dde3ea;--text:#141a21;--muted:#5d6678;--accent:#4d7c0f;--live:#dc2626}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;transition:background .25s}
.app-header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.2px}
.brand h1 span{color:var(--accent)}
.brand p{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:2px}
.hspacer{flex:1}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
.icon-btn.on{color:var(--accent);border-color:var(--accent)}
.status-line{padding:7px 14px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
.search-wrap{padding:4px 12px 8px}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:13px;padding:11px 13px;outline:none}
.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:10px;font-weight:800;letter-spacing:1px;cursor:pointer;text-transform:uppercase}
.chip.active{background:var(--accent);color:#12140a;border-color:var(--accent)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;max-width:680px;margin:0 auto;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;cursor:pointer;font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.nav-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-btn.active{color:var(--accent)}
.view{display:none;padding:6px 12px}
.view.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;margin-bottom:9px;cursor:pointer}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:8px}
.card-league{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.8px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pill{font-size:10px;font-weight:800;padding:4px 8px;border-radius:6px;letter-spacing:.5px;white-space:nowrap;text-transform:uppercase}
.pill.live{background:rgba(255,77,77,.14);color:var(--live);display:flex;align-items:center;gap:5px}
.pill.live::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
.pill.ft{background:var(--panel2);color:var(--muted)}
.pill.pre{background:var(--panel2);color:var(--accent)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.star-btn{background:none;border:none;padding:2px;cursor:pointer;color:var(--muted);flex:0 0 auto}
.star-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.star-btn.on{color:var(--gold)}
.star-btn.on svg{fill:currentColor}
.team{display:flex;align-items:center;gap:9px;padding:4px 0}
.team img{width:21px;height:21px;object-fit:contain}
.team .nm{flex:1;font-size:14px;font-weight:600}
.team .sc{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.team.winner .nm{color:var(--accent)}
.meta{font-size:10px;color:var(--muted);margin-top:7px;padding-top:7px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.count{color:var(--accent);font-weight:700}
.news-thumb{width:100%;height:150px;object-fit:cover;border-radius:8px;margin-bottom:9px;background:var(--panel2)}
.news-card{cursor:default}
.news-card h3{font-size:15px;line-height:1.4;margin-bottom:6px;font-weight:700}
.news-card p{font-size:12px;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.news-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.news-foot time{font-size:10px;color:var(--muted)}
.read-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:11px;font-weight:700;padding:7px 14px;border-radius:7px;cursor:pointer}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);transition:opacity .2s}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:9px 8px;text-align:center}
th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--line);font-weight:700}
td{border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
td:nth-child(2),th:nth-child(2){text-align:left;font-weight:600}
td.pts{font-weight:800;color:var(--accent)}
.app-footer{padding:20px 14px;text-align:center;color:var(--muted);font-size:11px;line-height:1.7}
.share-app{margin-top:9px;background:var(--accent);color:#12140a;border:none;font-weight:800;padding:11px 22px;border-radius:8px;font-size:12px;cursor:pointer}
.empty{text-align:center;padding:44px 20px;color:var(--muted);font-size:12px;line-height:1.7}
.loading{text-align:center;padding:26px;color:var(--muted);font-size:12px}
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none;animation:fade .2s}
.overlay.open{display:block}
.dhead{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.back-btn{background:none;border:none;color:var(--text);cursor:pointer;display:grid;place-items:center;padding:4px}
.back-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.dhead h2{font-size:14px;font-weight:800}
.dbody{padding:14px;max-width:680px;margin:0 auto}
.dscore{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 14px;text-align:center;margin-bottom:14px}
.dscore .lg{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:800}
.dteams{display:flex;justify-content:space-around;align-items:flex-start;margin-top:16px;gap:8px}
.dteam{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.dteam img{width:48px;height:48px;object-fit:contain}
.dteam .tn{font-size:13px;font-weight:700;text-align:center;word-wrap:break-word}
.ddigits{font-size:36px;font-weight:900;font-variant-numeric:tabular-nums}
.dmid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 6px}
.dst{font-size:10px;font-weight:800;padding:5px 10px;border-radius:6px;text-transform:uppercase;letter-spacing:.6px}
.dsec{margin:18px 0 4px;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.evrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:7px;font-size:12px}
.evmin{flex:0 0 auto;font-weight:800;color:var(--accent);font-size:11px;min-width:36px;font-variant-numeric:tabular-nums}
.evtxt{flex:1;line-height:1.4}
.statrow{margin-bottom:10px}
.statnames{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}
.statbar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--panel2);gap:3px}
.statbar .sA{background:var(--accent)}
.statbar .sB{background:var(--muted)}
.ad-slot{margin:10px 12px;border:1px dashed var(--line);border-radius:var(--radius);background:var(--panel);color:var(--muted);font-size:11px;text-align:center;padding:14px;letter-spacing:.5px;line-height:1.6}
.ad-slot:empty{display:none}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#12140a;font-size:12px;font-weight:800;padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:all .3s;z-index:60;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="app-header">

  <button class="icon-btn" id="themeBtn" title="Thème"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>

<footer class="app-footer">
  <p>ScoreWave · Données en direct : ESPN · Actualisation auto 45 s</p>

<nav class="bottom-nav">

</nav>

<div class="overlay" id="detailOverlay">
  <div class="dhead">
    <button class="back-btn" id="detailBack"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <h2>Détail du match</h2>
