<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<title>ScoreWave — Live Scores</title>
<style>
:root{--bg:#0a0b0d;--panel:#101318;--panel2:#151a21;--line:#1f242d;--text:#f5f7fa;--muted:#8a93a3;--accent:#c9f24e;--live:#ff4d4d;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.app-header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(10,11,13,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.brand h1{font-size:17px;letter-spacing:.3px;font-weight:800}
.brand h1 span{color:var(--accent)}
.brand p{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:1px}
.status-line{padding:8px 16px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;max-width:640px;margin:0 auto;display:flex;background:rgba(13,15,18,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 0;cursor:pointer;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-btn.active{color:var(--accent)}
.view{display:none;padding:10px 12px}
.view.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
.chips{display:flex;gap:7px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:11px;font-weight:800;letter-spacing:1px;cursor:pointer;text-transform:uppercase}
.chip.active{background:var(--accent);color:#12140a;border-color:var(--accent)}
.league-head{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.league-head img{width:16px;height:16px;object-fit:contain}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:9px}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.card-league{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.8px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:10px;font-weight:800;padding:4px 9px;border-radius:6px;letter-spacing:.6px;white-space:nowrap;text-transform:uppercase}
.pill.live{background:rgba(255,77,77,.14);color:var(--live);display:flex;align-items:center;gap:6px}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
.pill.ft{background:rgba(138,147,163,.12);color:var(--muted)}
.pill.pre{background:rgba(201,242,78,.1);color:var(--accent)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.team{display:flex;align-items:center;gap:10px;padding:5px 0}
.team img{width:22px;height:22px;object-fit:contain}
.team .nm{flex:1;font-size:14px;font-weight:600}
.team .sc{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.team.winner .nm{color:var(--accent)}
.meta{font-size:10px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.news-thumb{width:100%;height:150px;object-fit:cover;border-radius:8px;margin-bottom:10px;background:var(--panel2)}
.news-card h3{font-size:15px;line-height:1.4;margin-bottom:6px;font-weight:700}
.news-card p{font-size:12px;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.news-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.news-foot time{font-size:10px;color:var(--muted)}
.read-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:11px;font-weight:700;padding:7px 14px;border-radius:7px;cursor:pointer;letter-spacing:.5px}
.section-title{font-size:13px;font-weight:800;margin:12px 2px 10px;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:9px 8px;text-align:center}
th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--line);font-weight:700}
td{border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
td:nth-child(2),th:nth-child(2){text-align:left;font-weight:600}
td.pts{font-weight:800;color:var(--accent)}
.app-footer{padding:22px 16px;text-align:center;color:var(--muted);font-size:11px;line-height:1.7}
.share-app{margin-top:10px;background:var(--accent);color:#12140a;border:none;font-weight:800;padding:11px 22px;border-radius:8px;font-size:12px;cursor:pointer;letter-spacing:.5px}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:12px}
.empty .big{font-size:28px;display:block;margin-bottom:10px;opacity:.5}
.loading{text-align:center;padding:30px;color:var(--muted);font-size:12px}
</style>
</head>
<body>

<header class="app-header">
  <div class="logo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#12140a"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>
  </div>
  <div class="brand">
    <h1>Score<span>Wave</span></h1>
    <p>Live · Tous les sports</p>
  </div>
</header>

<div class="status-line" id="statusLine"><span class="dot-live" id="statusDot" style="visibility:hidden"></span><span id="statusText">Connexion aux flux…</span></div>

<main>
  <section id="view-scores" class="view active">
    <div class="chips" id="catChips"></div>
    <div id="matchList"></div>
  </section>

  <section id="view-news" class="view">
    <div id="newsList"></div>
  </section>

  <section id="view-upcoming" class="view">
    <div id="fixtureList"></div>
  </section>

  <section id="view-table" class="view">
    <div class="chips" id="tableChips"></div>
    <div class="table-wrap" id="tableWrap">
      <table id="standingsTable">
        <thead><tr><th>#</th><th>Équipe</th><th>J</th><th>G</th><th>N</th><th>P</th><th>Pts</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="app-footer">
  <p>ScoreWave · Données en direct : ESPN · Actualisation auto 45 s</p>
  <button class="share-app" id="shareApp">Partager l'app</button>
</footer>

<nav class="bottom-nav">
  <button class="nav-btn active" data-view="scores"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18" opacity=".4"/></svg>Scores</button>
  <button class="nav-btn" data-view="news"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/></svg>Actus</button>
  <button class="nav-btn" data-view="upcoming"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Agenda</button>
  <button class="nav-btn" data-view="table"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Classement</button>
</nav>

<script src="app.js"></script>
</body>
</html>
